# Full local stack: API + MongoDB + Redis + Prometheus + Grafana
#   docker compose -f docker-compose.monitoring.yml up -d --build
# API: http://localhost:5000  Docs: /api-docs  Metrics: /metrics
# Prometheus: http://localhost:9090   Grafana: http://localhost:3000 (admin / admin)
services:
  backend:
    build: ./backend
    container_name: merchantflow-backend
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/merchantflow
      REDIS_URL: redis://redis:6379
      SECRET: ${SECRET:-dev-access-secret-change-me}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-refresh-secret-change-me}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [backend]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  mongo-data:
  grafana-data:
