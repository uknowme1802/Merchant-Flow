name: Frontend CI:

on:
  push:
    branches:
     - Main

  pull_request:
    branches:
     - Main

jobs:
  frontend-ci:
    runs-on:
      ubuntu-latest

    defaults:
      runs:
        working-directory: frontend

    steps:
      #1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      #2 Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version:20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      #3 Install dependecies
      - name: Install dependecies
        run: npm ci
      
      #4 Lint
      - name: Run Lint
        run: npm run Lint
      
      #5 Build
      - name: Build
        run: npm run build