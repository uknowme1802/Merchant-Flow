name: Keep MerchantFlow Backend Alive

on:
  schedule:
    #Run every 5 minutes
    - cron: "*/5 * * * *"
  # Allow manual execution from Github Actions
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Health endpoint
        run: |
          echo "Pinging MerchantFlow backend..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30\
            --retry-delay 5\
            https://merchant-flow-seuw.onrender.com/health) || response="000"

          echo "HTTP status: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Backend health check failed."
            exit 1
          fi 

          echo "MerchantFlow backend is healthy"