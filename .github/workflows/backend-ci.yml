name: Backend CI

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    # A hung database test must not run for hours (the default limit is 6 hours).
    timeout-minutes: 15

    env:
      # The order and claim tests run against a real MongoDB that mongodb-memory-server starts in
      # memory. Pin its version so every run tests against the same database, and keep the binary
      # outside node_modules so `npm ci` does not delete it.
      MONGOMS_VERSION: "8.2.6"
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

    defaults:
      run:
        working-directory: backend

    steps:
      # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2 Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3 Install dependencies
      - name: Install dependencies
        run: npm ci

      # 3b Fail the build on known high/critical vulnerabilities in production dependencies
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # 3c MongoDB for the real-database tests: cached between runs, and started once here so a
      # download or runner problem fails this step with a clear name, not a test hook timeout.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-binary-${{ runner.os }}-8.2.6

      - name: Prepare MongoDB for the tests
        run: node -e "require('mongodb-memory-server').MongoMemoryServer.create().then((s) => s.stop())"

      # 4 Run tests
      - name: Run tests
        run: npm test

      # 5 Build Docker image (validates the Dockerfile still builds cleanly)
      - name: Build Docker image
        run: docker build -t merchantflow-backend:ci .