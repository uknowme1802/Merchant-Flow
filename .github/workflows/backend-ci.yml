name: Backend CI

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - Main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # 1 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3 Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4 Run tests
      - name: Run tests
        run: npm test

      # 5 Build Docker image (validates the Dockerfile still builds cleanly)
      - name: Build Docker image
        run: docker build -t merchantflow-backend:ci .