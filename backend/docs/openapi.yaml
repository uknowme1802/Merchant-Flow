openapi: 3.0.3
info:
  title: MerchantFlow API
  version: 1.0.0
  description: |
    Payment analytics and checkout API. Create orders, verify UPI payments by UTR,
    and receive HMAC-signed webhooks for payment events.

    **Integration flow**
    1. `POST /api/auth/login` to get an access token (and complete 2FA if enabled).
    2. `POST /api/checkout` to create an order and get a UPI QR code.
    3. `POST /api/checkout/{id}/verify` with the payer's 12-digit UTR.
    4. Receive `payment.success` on your webhook endpoint and verify `X-Webhook-Signature`.

    **Merchant API flow (orders)**
    1. Sign your requests with your MID and secret key (see the `merchantSignature` scheme) and check them with `GET /v1/whoami`.
    2. `POST /v1/orders` with `amountPaise` to create an order; send the customer to the returned `checkoutUrl`.
    3. The customer pays by UPI and enters the 12-digit UTR on the checkout page (`/api/pay/{orderId}/claim`).
    4. Read the result with `GET /v1/orders/{orderId}` (`status` is `pending`, `success` or `failed`).
    Amounts are whole paise. Both sandbox and production modes are simulations; no real money moves.

    **Callbacks.** When an order is paid or fails (including expiring after 15 minutes), we `POST` a JSON message
    to the merchant's `callbackUrl` (set by an admin in Edit Config). The message is signed:
    `X-Callback-Signature` is `HMAC_SHA256(secret, rawBody)` as a hex digest, made with the merchant's active key
    for the order's mode, and `X-Callback-Event` is `order.success` or `order.failed`. Answer with HTTP **200**;
    any other answer, or no answer within 5 seconds, counts as a failure and we retry every 5 minutes, up to 10
    attempts. Every retry sends the same body. A callback can be resent by hand from the dashboard.

    **Webhook signature:** `HMAC_SHA256(secret, rawBody)` as a hex digest, sent in `X-Webhook-Signature`.
servers:
  - url: https://merchant-flow-seuw.onrender.com
    description: Production
  - url: http://localhost:5000
    description: Local
tags:
  - name: Auth
  - name: Two-Factor
  - name: Checkout
  - name: Transactions
  - name: Dashboard
  - name: Users
  - name: Payment Codes
  - name: Webhooks
  - name: Merchant
  - name: Merchant Admin
  - name: Bank Admin
  - name: Merchant API
  - name: Customer Checkout
  - name: Callbacks
  - name: Payin
  - name: Ops
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Returns tokens, or `twoFactorRequired` with a `pendingToken` when 2FA is enabled. Rate limited to 10 requests / 15 min.

        The `email` field also accepts a username, and neither is case sensitive. When `mustChangePassword` is true the login used a
        temporary password: every other endpoint answers 403 with `code: PASSWORD_CHANGE_REQUIRED` until
        `POST /api/auth/change-password` succeeds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, description: Email address or username }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in, or 2FA required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginResponse"
                  - $ref: "#/components/schemas/TwoFactorRequired"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "The account is disabled (`code: ACCOUNT_DISABLED`), or its merchant is suspended or deleted (`code: MERCHANT_SUSPENDED`)" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/session:
    get:
      tags: [Auth]
      summary: Check that the session is still valid
      description: Answers 401 once the user was disabled, had the password reset or the role changed, or the merchant was suspended or deleted.
      responses:
        "200": { description: The session is valid }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change your own password
      description: |
        The only call (besides logout) that works while a temporary password is in place. Signs every
        other session out and returns fresh tokens for this one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: New access and refresh tokens }
        "400": { description: "Too short, or the same as the current password" }
        "401": { description: The current password is wrong }
  /api/auth/2fa/verify-login:
    post:
      tags: [Auth]
      summary: Complete login with a TOTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pendingToken, token]
              properties:
                pendingToken: { type: string }
                token: { type: string, example: "123456" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Get a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: Refresh token }
      responses:
        "200":
          description: New access token
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "The token was revoked, or the account is disabled (`code: ACCOUNT_DISABLED`)" }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Logged out }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/2fa/status:
    get:
      tags: [Two-Factor]
      summary: Whether 2FA is enabled for the current user
      responses:
        "200": { description: OK }
  /api/2fa/setup:
    post:
      tags: [Two-Factor]
      summary: Start 2FA setup (returns a QR code and temporary secret)
      responses:
        "200": { description: QR code for an authenticator app }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/2fa/enable:
    post:
      tags: [Two-Factor]
      summary: Confirm setup with a TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, example: "123456" }
      responses:
        "200": { description: 2FA enabled }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/2fa/disable:
    post:
      tags: [Two-Factor]
      summary: Disable 2FA with a valid TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, example: "123456" }
      responses:
        "200": { description: 2FA disabled }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/checkout:
    post:
      tags: [Checkout]
      summary: Create an order and UPI QR code
      description: |
        `amount` must be greater than 0 with at most 2 decimal places.

        **Idempotency:** send an `Idempotency-Key` header (1-128 chars: letters, numbers, `_ - : .`).
        Repeating a request with the same key returns the original order (HTTP 200 with an
        `Idempotent-Replayed: true` header) instead of creating a duplicate.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, exclusiveMinimum: 0, example: 500 }
      responses:
        "200":
          description: Replay of an earlier request with the same Idempotency-Key (returns the original order)
        "201":
          description: Order created (status `Pending`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Transaction" }
                  qrCode: { type: string, description: PNG data URL of the UPI QR }
                  upiId: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/checkout/{id}:
    get:
      tags: [Checkout]
      summary: Get order status
      description: Owner or admin only.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Transaction" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/checkout/{id}/verify:
    post:
      tags: [Checkout]
      summary: Verify a payment by UTR
      description: |
        Matches the UTR and order amount against registered payment codes. A match marks
        the order `Success`, consumes the code, and fires `payment.success`. An unknown or
        already-used UTR leaves the order `Pending`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utr]
              properties:
                utr: { type: string, pattern: '^\d{12}$', example: "123456789012" }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  verified: { type: boolean }
                  alreadyUsed: { type: boolean }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/transactions:
    get:
      tags: [Transactions]
      summary: List transactions (paginated, Redis-cached for 60 s)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: status, in: query, schema: { type: string, enum: [Success, Pending, Failed] } }
      responses:
        "200": { description: Transactions page }
    post:
      tags: [Transactions]
      summary: Create a transaction (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transaction" }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Revenue and transaction statistics
      responses:
        "200": { description: Dashboard stats }
  /api/users:
    get:
      tags: [Users]
      summary: List users (admin)
      description: Paged, newest first. `search` matches username and email. Never returns passwords, tokens or two-factor secrets.
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 100 } }
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Users]
      summary: Create an admin or agent (admin)
      description: |
        The server generates a temporary password and returns it once in `temporaryPassword`
        (`Cache-Control: no-store`). The user must change it at first login. Merchant logins are
        created with their merchant, not here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email]
              properties:
                username: { type: string, pattern: "^[a-z0-9_]{3,30}$" }
                email: { type: string, format: email }
                role: { type: string, enum: [admin, agent], default: agent }
      responses:
        "201": { description: The user and a one-time temporary password }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Username or email already in use }
  /api/users/{id}:
    patch:
      tags: [Users]
      summary: Edit a user (admin)
      description: |
        Send only the fields to change. Disabling a user or changing their role signs them out at once;
        they log in again to get the new role. An admin cannot disable or demote themself, and the last
        active admin cannot be disabled or demoted. Merchant logins are read-only here (409).
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                username: { type: string, pattern: "^[a-z0-9_]{3,30}$" }
                email: { type: string, format: email }
                role: { type: string, enum: [admin, agent] }
                disabled: { type: boolean }
      responses:
        "200": { description: Updated user }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Username or email taken, last active admin, or a merchant login" }
  /api/users/{id}/require-mfa:
    post:
      tags: [Users]
      summary: Require two-factor for a user, the MFA switch on (admin)
      description: A user who has not set it up is signed out, and after the next login every call answers 403 `MFA_SETUP_REQUIRED` until they finish the setup under `/api/2fa`. Not for your own account or for merchant logins.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated user }
        "400": { description: Your own account }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already required, or a merchant login" }
  /api/users/{id}/disable-mfa:
    post:
      tags: [Users]
      summary: Turn two-factor off for a user, the MFA switch off (admin)
      description: Clears the user's authenticator code and the requirement. Turning the switch off and on again resets it. Not for your own account or for merchant logins.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Updated user }
        "400": { description: Your own account }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Two-factor is neither enabled nor required, or a merchant login" }
  /api/users/{id}/reset-password:
    post:
      tags: [Users]
      summary: Reset a user's password (admin)
      description: |
        Returns a new temporary password once (`Cache-Control: no-store`), signs the user out everywhere
        and forces a change at next login. Not for your own account or for merchant logins.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: One-time temporary password }
        "400": { description: Your own account }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A merchant login }
  /api/valid-payments:
    get:
      tags: [Payment Codes]
      summary: List registered payment codes (admin)
      responses:
        "200": { description: Payment codes }
    post:
      tags: [Payment Codes]
      summary: Register a valid payment code (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utr, amount]
              properties:
                utr: { type: string, example: "123456789012" }
                amount: { type: number, example: 500 }
      responses:
        "201": { description: Created }
        "409": { description: UTR already registered }
  /api/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks (admin)
      responses:
        "200": { description: Webhooks (secrets are never returned) }
    post:
      tags: [Webhooks]
      summary: Register a webhook (admin)
      description: |
        The signing secret is generated if omitted and returned once, in this response.
        A supplied secret must be at least 16 characters.

        **Retries:** a failed delivery is retried automatically with backoff (1 min, 5 min, 30 min, 2 h;
        5 attempts in total by default). Each log row shows `attempts` and `nextRetryAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { $ref: "#/components/schemas/WebhookEvent" }
                secret: { type: string }
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/webhooks/{id}:
    patch:
      tags: [Webhooks]
      summary: Enable or disable a webhook (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200": { description: Updated }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: Last 25 deliveries for one webhook (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Deliveries }
  /api/webhooks/deliveries/{id}/replay:
    post:
      tags: [Webhooks]
      summary: Re-send a delivery now (admin)
      description: Sends the stored payload again and starts a fresh retry cycle if it fails.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: "Replay result: success, statusCode, error, attempts" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The webhook for this delivery no longer exists }
  /api/webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: Delivery logs across all webhooks (admin)
      parameters:
        - { name: transactionId, in: query, description: Case-insensitive "contains" search, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200": { description: Paginated delivery logs }
  /api/merchant/signup:
    post:
      tags: [Merchant]
      summary: Register a merchant (status starts as pending) and its owner login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, businessType, country, contactName, contactPhone, email, username, password, kyc]
              properties:
                businessName: { type: string }
                businessType: { type: string, enum: [sole_proprietor, company, non_profit, other] }
                website: { type: string }
                country: { type: string, example: IN }
                contactName: { type: string }
                contactPhone: { type: string }
                email: { type: string }
                username: { type: string, pattern: "^[a-z0-9_]{3,30}$", description: "The owner's login name; login accepts it in place of the email" }
                password: { type: string, minLength: 8 }
                kyc:
                  type: object
                  required: [registrationNumber, address]
                  properties:
                    registrationNumber: { type: string }
                    taxId: { type: string }
                    address: { type: string }
      responses:
        "201": { description: "Created: merchant {mid, businessName, status}" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Email already registered }
  /api/merchant/me:
    get:
      tags: [Merchant]
      summary: Current merchant, your team role and what you may do (sandbox/live)
      responses:
        "200": { description: Merchant profile and capabilities }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/merchant/credentials:
    get:
      tags: [Merchant]
      summary: List API keys (metadata only, owner or developer)
      responses:
        "200": { description: "Keys with keyHint, status, expiresAt, lastUsedAt" }
    post:
      tags: [Merchant]
      summary: Create the API key for an environment; the secret is shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                environment: { type: string, enum: [sandbox, live] }
      responses:
        "201": { description: "mid, secret (once), credential" }
        "403": { description: Live mode needs an approved merchant }
        "409": { description: An active key already exists for this environment }
  /api/merchant/credentials/{environment}/rotate:
    post:
      tags: [Merchant]
      summary: Issue a new key; the old key keeps working for the grace period
      parameters:
        - { name: environment, in: path, required: true, schema: { type: string, enum: [sandbox, live] } }
      responses:
        "201": { description: New secret (once) and previousKeyExpiresAt }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/merchant/credentials/{id}:
    delete:
      tags: [Merchant]
      summary: Revoke a key immediately
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/merchant/team:
    get:
      tags: [Merchant]
      summary: List team members (owner)
      responses:
        "200": { description: Members }
    post:
      tags: [Merchant]
      summary: Add a developer or finance member (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, merchantRole]
              properties:
                email: { type: string }
                password: { type: string }
                merchantRole: { type: string, enum: [developer, finance] }
      responses:
        "201": { description: Member created }
        "409": { description: Email already registered }
  /api/merchant/team/{id}:
    delete:
      tags: [Merchant]
      summary: Remove a team member (owner cannot be removed)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/merchant/audit-logs:
    get:
      tags: [Merchant]
      summary: Audit trail for your merchant (owner)
      responses:
        "200": { description: Paginated audit entries }
  /api/admin/merchants:
    get:
      tags: [Merchant Admin]
      summary: Merchant List (admin)
      description: Each row carries the owner's `username`, `mfaEnabled`, the `mode`, `remark` and `config`. `search` matches MID, username, business name, email and remark. Deleted merchants are left out unless `status=deleted`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, active, suspended, rejected, deleted] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200": { description: Paginated merchants }
    post:
      tags: [Merchant Admin]
      summary: Create an approved merchant (admin)
      description: |
        Creates the merchant (status `active`) and its owner login. A temporary password for the owner
        is returned once in `temporaryPassword` (`Cache-Control: no-store`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessName, businessType, contactName, contactPhone, email, username, mode, kyc]
              properties:
                businessName: { type: string }
                businessType: { type: string, enum: [sole_proprietor, company, non_profit, other] }
                website: { type: string, format: uri }
                country: { type: string, example: IN }
                contactName: { type: string }
                contactPhone: { type: string, example: "+91 98765 43210" }
                email: { type: string, format: email }
                username: { type: string, pattern: "^[a-z0-9_]{3,30}$" }
                mode: { type: string, enum: [sandbox, production] }
                remark: { type: string, maxLength: 200 }
                kyc:
                  type: object
                  required: [registrationNumber, address]
                  properties:
                    registrationNumber: { type: string }
                    taxId: { type: string }
                    address: { type: string }
      responses:
        "201": { description: "The merchant, the owner's username and a one-time temporary password" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Username or email already in use }
  /api/admin/merchants/{id}/config:
    patch:
      tags: [Merchant Admin]
      summary: Edit Config (admin)
      description: Charges are integer basis points (250 = 2.50%), amounts are paise. Send only the fields to change. Audited with the old and new values.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                webhookAutoTrigger: { type: boolean, description: Switch callbacks to this merchant on or off }
                callbackUrl: { type: string, format: uri, nullable: true, maxLength: 500, description: "Where order callbacks are sent. `https` only in production, and it must resolve to a public address. `null` clears it." }
                payinBps: { type: integer, minimum: 0, maximum: 10000 }
                payoutBps: { type: integer, minimum: 0, maximum: 10000 }
                settlementBps: { type: integer, minimum: 0, maximum: 10000 }
                settlementDays: { type: integer, minimum: 0, maximum: 30 }
                minAmountPaise: { type: integer, minimum: 0, nullable: true }
                maxAmountPaise: { type: integer, minimum: 0, nullable: true }
                remark: { type: string, maxLength: 200 }
      responses:
        "200": { description: Updated merchant }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/merchants/{id}/team:
    get:
      tags: [Merchant Admin]
      summary: A merchant's logins (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: "Team members: username, email, team role, two-factor state" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/merchants/{id}/reset-password:
    post:
      tags: [Merchant Admin]
      summary: Reset a merchant login's password (admin)
      description: "Resets the owner unless `userId` names another member of this merchant. Returns the temporary password once (`Cache-Control: no-store`) and signs that login out."
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string }
      responses:
        "200": { description: One-time temporary password }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/merchants/{id}/credentials:
    post:
      tags: [Merchant Admin]
      summary: Generate or regenerate the merchant's key (admin)
      description: |
        The key is for the merchant's current mode (`sk_test_...` in sandbox, `sk_live_...` in production).
        The secret is returned once (`Cache-Control: no-store`) and is never listed or audited. If a key
        exists it is replaced, and the old one keeps working for the grace period (24 hours by default).
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201": { description: "The credential metadata, the one-time `secret`, `regenerated` and `previousKeyExpiresAt`" }
        "403": { description: The merchant's status does not allow keys }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/merchants/{id}/delete:
    post:
      tags: [Merchant Admin]
      summary: Delete a merchant, keeping its records (admin)
      description: A soft delete. The merchant leaves the list, its logins are signed out and refused, and its keys are revoked. Nothing is erased.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: The merchant with status `deleted` }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already deleted }
  /api/admin/merchants/{id}/force-delete:
    post:
      tags: [Merchant Admin]
      summary: Permanently remove a merchant (admin)
      description: Removes the merchant with its logins, keys and bank mappings. `confirmMid` must equal its MID. Bank accounts and audit entries are kept. This cannot be undone.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmMid]
              properties:
                confirmMid: { type: string }
      responses:
        "200": { description: "`removed` with the number of logins, credentials and mappings" }
        "400": { description: The MID does not match }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/merchants/{id}/require-mfa:
    post:
      tags: [Merchant Admin]
      summary: Require two-factor for the merchant's owner (admin)
      description: The owner is signed out and must set two-factor up right after the next login.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Required }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already required }
  /api/admin/merchants/{id}/disable-mfa:
    post:
      tags: [Merchant Admin]
      summary: Turn two-factor off for the merchant's owner (admin)
      description: Clears the owner's authenticator code and the requirement.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Turned off }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Two-factor is neither enabled nor required }
  /api/admin/merchants/{id}/switch-mode:
    post:
      tags: [Merchant Admin]
      summary: Switch a merchant between sandbox and production (admin)
      description: |
        The merchant must be `active` and `confirmMid` must equal its MID. Data of the old mode is hidden,
        not deleted. The old mode's key is revoked and a key for the new mode is returned once. Moving back
        to sandbox needs a `reason`.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, confirmMid]
              properties:
                mode: { type: string, enum: [sandbox, production] }
                confirmMid: { type: string }
                reason: { type: string }
      responses:
        "200": { description: "The merchant, the new credential and its one-time `secret`" }
        "400": { description: "Wrong MID, or no reason when moving back to sandbox" }
        "409": { description: "Already in that mode, or the merchant is not active" }
  /api/admin/merchants/{id}:
    get:
      tags: [Merchant Admin]
      summary: One merchant with KYC details and credential metadata (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Merchant and credentials }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/merchants/{id}/{action}:
    post:
      tags: [Merchant Admin]
      summary: Approve, reject, suspend or reactivate (admin)
      description: Reject and suspend require a `reason`. Transitions that do not fit the current status return 409. Suspending signs every login of the merchant out at once and refuses their login until it is reactivated.
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject, suspend, reactivate] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200": { description: Updated merchant }
        "409": { description: Not allowed from the current status }
  /api/admin/merchants/{id}/credentials/{credentialId}:
    delete:
      tags: [Merchant Admin]
      summary: Emergency revoke of a merchant key (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: credentialId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Revoked }
  /api/admin/audit-logs:
    get:
      tags: [Merchant Admin]
      summary: Platform audit trail (admin)
      responses:
        "200": { description: Paginated audit entries }
  /api/admin/banks:
    get:
      tags: [Bank Admin]
      summary: Bank List (admin)
      parameters:
        - { name: search, in: query, schema: { type: string }, description: "Bank ID, holder, bank name, account number or UPI ID" }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200": { description: Paginated bank accounts }
    post:
      tags: [Bank Admin]
      summary: Add a bank account (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BankInput"
                - required: [holderName, bankName, accountNumber, ifsc, upiId]
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: The same account number and IFSC already exists }
  /api/admin/banks/{id}:
    patch:
      tags: [Bank Admin]
      summary: Edit a bank account (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankInput" }
      responses:
        "200": { description: Updated }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Bank Admin]
      summary: Delete a bank account (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Deleted }
        "409": { description: The bank is mapped to a merchant; set it to inactive instead }
  /api/admin/banks/{id}/verify:
    post:
      tags: [Bank Admin]
      summary: Mark a bank account as verified (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Verified }
  /api/admin/merchants/{id}/banks:
    get:
      tags: [Bank Admin]
      summary: Banks mapped to a merchant, the PAYIN page (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": { description: Mappings with their bank }
    post:
      tags: [Bank Admin]
      summary: Map a bank to a merchant (admin)
      description: The mapping's own limits are optional and may only be stricter than the bank's.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankId]
              properties:
                bankId: { type: string }
                minPaise: { type: integer, nullable: true }
                maxPaise: { type: integer, nullable: true }
                dailyLimitPaise: { type: integer, nullable: true }
      responses:
        "201": { description: Mapped }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Already mapped }
  /api/admin/merchants/{id}/banks/{mappingId}:
    patch:
      tags: [Bank Admin]
      summary: Turn a mapping on or off (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200": { description: The mapping with its bank }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Bank Admin]
      summary: Remove a mapping (admin)
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/admin/bank-mappings/bulk:
    post:
      tags: [Bank Admin]
      summary: Bulk Payin Meta Mapping (admin)
      description: Maps every bank to every merchant. Pairs that already exist are skipped, so the call can be repeated. At most 50 of each and 500 pairs per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantIds, bankIds]
              properties:
                merchantIds: { type: array, items: { type: string }, minItems: 1, maxItems: 50 }
                bankIds: { type: array, items: { type: string }, minItems: 1, maxItems: 50 }
      responses:
        "200": { description: "Nothing new: every pair already existed (`created: 0`)" }
        "201": { description: "`created` and `skipped` counts" }
        "404": { description: An unknown merchant or bank; nothing is mapped }
  /api/admin/bank-credits:
    get:
      tags: [Bank Admin]
      summary: Bank statement (admin)
      description: Money that arrived in the bank accounts, as entered by an admin. A credit is claimed by at most one order.
      parameters:
        - { name: bankId, in: query, schema: { type: string }, description: Only credits received by this bank (its database id) }
        - { name: claimed, in: query, schema: { type: boolean }, description: "`true` for credits an order has claimed, `false` for open ones" }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Paginated credits, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  data: { type: array, items: { $ref: "#/components/schemas/BankCredit" } }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Bank Admin]
      summary: Add a bank statement line (admin)
      description: Records money that arrived in a bank account. A customer's order claims it by entering the same UTR, for the same amount, on the same bank. The action is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankId, amountPaise, utr]
              properties:
                bankId: { type: string, description: The bank account's database id }
                amountPaise: { type: integer, minimum: 1, example: 50000 }
                utr: { type: string, pattern: "^\\d{12}$", example: "412345678901" }
                receivedAt: { type: string, format: date-time, description: Defaults to now; cannot be in the future }
                note: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  credit: { $ref: "#/components/schemas/BankCredit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: Unknown bank account }
        "409": { description: "A credit with this UTR already exists" }
  /api/webhook-events:
    get:
      tags: [Callbacks]
      summary: Webhook Events - callback delivery log (admin and agent)
      description: Every callback sent to merchants and what happened, newest first. Open to dashboard admins and agents, not to merchants. The sent body is fetched per delivery from the body endpoint.
      parameters:
        - { name: merchantId, in: query, schema: { type: string }, description: Only this merchant (its database id) }
        - { name: mode, in: query, schema: { type: string, enum: [sandbox, production] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, failed, cancelled] } }
        - { name: orderId, in: query, schema: { type: string, example: ord_k3x9f2ab7mqp3x9f } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Only callbacks created at or after this time }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: Only callbacks created at or before this time }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Paginated deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  data: { type: array, items: { $ref: "#/components/schemas/CallbackDelivery" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/webhook-events/{id}/body:
    get:
      tags: [Callbacks]
      summary: The message we sent (admin and agent)
      description: The exact JSON body sent for one callback, for the Data Sent view. The signature is not stored and is not returned.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The sent message
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id: { type: string }
                  orderId: { type: string }
                  event: { type: string, enum: [order.success, order.failed] }
                  url: { type: string }
                  headers: { type: object, additionalProperties: { type: string } }
                  body: { $ref: "#/components/schemas/CallbackPayload" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/webhook-events/{id}/resend:
    post:
      tags: [Callbacks]
      summary: Resend a callback (admin)
      description: Starts a fresh retry cycle and sends right away. Works for pending, delivered and failed callbacks. Audited.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The delivery after the new attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  callback: { $ref: "#/components/schemas/CallbackDelivery" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The callback was cancelled (the merchant changed mode) and cannot be resent }
  /api/merchant/callbacks:
    get:
      tags: [Callbacks]
      summary: Your callback log (merchant)
      description: Callbacks sent to your callback URL, in your current mode only. Any team role can read it.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, failed, cancelled] } }
        - { name: orderId, in: query, schema: { type: string, example: ord_k3x9f2ab7mqp3x9f } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Paginated deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  data: { type: array, items: { $ref: "#/components/schemas/CallbackDelivery" } }
  /api/merchant/callbacks/{id}/resend:
    post:
      tags: [Callbacks]
      summary: Resend one of your callbacks (merchant)
      description: Owner and developer roles only. A callback that is not yours, or is from the other mode, answers 404.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The delivery after the new attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  callback: { $ref: "#/components/schemas/CallbackDelivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The callback was cancelled and cannot be resent }
  /api/payin/filter-options:
    get:
      tags: [Payin]
      summary: Payin - merchants and banks for the filter drop-downs (admin and agent)
      description: Public fields only (MID and business name; bank id, bank name and holder name), up to 500 of each.
      responses:
        "200":
          description: The drop-down choices
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  merchants:
                    type: array
                    items: { type: object, properties: { mid: { type: string }, businessName: { type: string } } }
                  banks:
                    type: array
                    items: { type: object, properties: { bankId: { type: string }, bankName: { type: string }, holderName: { type: string } } }
        "403": { description: Merchants cannot use this }
  /api/payin/orders:
    get:
      tags: [Payin]
      summary: Payin - every order with totals (admin and agent)
      description: |
        The orders table of the Payin tab, newest first, with totals over EVERY order that matches the filters (not just the page).
        Fee and payable are summed over successful orders only. Open to admins and agents, not to merchants. Staff see the full bank account number.
      parameters:
        - { name: search, in: query, schema: { type: string }, description: "An exact order id, merchant order id or UTR" }
        - { name: status, in: query, schema: { type: string, enum: [pending, success, failed] } }
        - { name: mode, in: query, schema: { type: string, enum: [sandbox, production] } }
        - { name: merchant, in: query, schema: { type: string }, description: Part of the merchant's MID or business name }
        - { name: bank, in: query, schema: { type: string, example: bank_k3x9f2ab }, description: A bank's public id }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: Only orders created at or after this time }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: Only orders created at or before this time }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Paginated orders with totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totals:
                    type: object
                    properties:
                      count: { type: integer }
                      amountPaise: { type: integer }
                      feePaise: { type: integer, description: Pay-in fees of successful orders }
                      payablePaise: { type: integer, description: Amount minus fee, for successful orders }
                      byStatus:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            count: { type: integer }
                            amountPaise: { type: integer }
                  data: { type: array, items: { $ref: "#/components/schemas/PayinOrder" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/payin/orders/{orderId}/resend-callback:
    post:
      tags: [Payin]
      summary: Resend the order's callback now (admin and agent)
      description: |
        Sends the order's CURRENT result to the merchant's current callback URL, even when auto-trigger is off. The callback is created if it does not exist,
        and its body is rebuilt from the order as it is now. Starts a fresh retry cycle. Audited. Answers `ORDER_PENDING` for an order that is still pending,
        `NO_CALLBACK_URL` when the merchant has none, and `ORDER_WRONG_MODE` for an order from the merchant's other mode.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The delivery after the new attempt (the result to show in a toast)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  callback: { $ref: "#/components/schemas/PayinCallback" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The order is pending (`ORDER_PENDING`), from the other mode (`ORDER_WRONG_MODE`), or its callback was cancelled" }
        "422": { description: "The merchant has no callback URL (`NO_CALLBACK_URL`)" }
  /api/payin/orders/{orderId}/amount:
    patch:
      tags: [Payin]
      summary: Correct the amount of an order (admin and agent)
      description: |
        Pending or successful orders only. The new amount stays inside the merchant's own minimum and maximum (`AMOUNT_OUT_OF_RANGE`).
        A successful order has its fee and payable recomputed from the rate stored on it. A reason is required and is kept in the audit log with the old and new amount.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountPaise, reason]
              properties:
                amountPaise: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  order: { $ref: "#/components/schemas/PayinOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The order is failed, or changed meanwhile (`ORDER_STATE_CONFLICT`)" }
        "422": { description: "Outside the merchant's minimum and maximum (`AMOUNT_OUT_OF_RANGE`)" }
  /api/payin/orders/{orderId}/utr:
    patch:
      tags: [Payin]
      summary: Correct the UTR of a successful order (admin and agent)
      description: A UTR pays one order only (`UTR_IN_USE` otherwise). A reason is required and is kept in the audit log with the old and new UTR.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utr, reason]
              properties:
                utr: { type: string, pattern: "^\\d{12}$" }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  order: { $ref: "#/components/schemas/PayinOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The UTR is used by another order (`UTR_IN_USE`), or the order is not successful (`ORDER_STATE_CONFLICT`)" }
  /api/payin/orders/{orderId}/fail:
    post:
      tags: [Payin]
      summary: Fail a pending or successful order (admin and agent)
      description: |
        Final: a failed order cannot be changed again. The merchant gets an `order.failed` callback with the reason `failed_by_staff` (the typed reason stays in the audit log only).
        Money that arrived is not touched; refunds come later.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200":
          description: The failed order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  order: { $ref: "#/components/schemas/PayinOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The order is already failed, or changed meanwhile (`ORDER_STATE_CONFLICT`)" }
  /v1/whoami:
    get:
      tags: [Merchant API]
      summary: Check that your signed requests work
      security:
        - merchantSignature: []
      parameters:
        - { name: X-MID, in: header, required: true, schema: { type: string } }
        - { name: X-Timestamp, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Your MID and environment }
        "401": { description: Invalid credentials }
        "403": { description: Merchant not active }
        "429": { description: Per-merchant rate limit exceeded }
  /v1/orders:
    post:
      tags: [Merchant API]
      summary: Create an order
      description: |
        Creates a payment request and picks the bank account the customer must pay. Send the customer to
        `checkoutUrl`; they pay by UPI and enter the 12-digit UTR, which completes the order.

        - The key must belong to the merchant's current mode: a sandbox key for a sandbox merchant, a live
          key for a production merchant. Both modes are simulations; no real money moves.
        - The amount must be within the merchant's own minimum and maximum, if set.
        - Send a `merchantOrderId` to make the call safe to retry: repeating it with the same amount returns
          the existing order (200); with a different amount it is refused (409).
        - A pending order expires after 15 minutes and becomes `failed`.
      security:
        - merchantSignature: []
      parameters:
        - { name: X-MID, in: header, required: true, schema: { type: string } }
        - { name: X-Timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderInput" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }
        "200":
          description: "`merchantOrderId` was already used with the same amount; the existing order is returned"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Invalid credentials }
        "403":
          description: "`code` is `WRONG_ENVIRONMENT` (key does not match the merchant's mode) or `MERCHANT_NOT_ACTIVE`"
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "409":
          description: "`MERCHANT_ORDER_ID_REUSED`: that `merchantOrderId` belongs to an order with a different amount"
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "422":
          description: "`AMOUNT_OUT_OF_RANGE`: outside this merchant's minimum or maximum"
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429": { description: Per-merchant rate limit exceeded }
        "503":
          description: "`NO_BANK_AVAILABLE`: the merchant has no active, verified UPI bank mapped"
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
  /v1/orders/{orderId}:
    get:
      tags: [Merchant API]
      summary: Get an order
      description: Returns one of your own orders in your current mode. An overdue pending order is returned as `failed`.
      security:
        - merchantSignature: []
      parameters:
        - { name: X-MID, in: header, required: true, schema: { type: string } }
        - { name: X-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: orderId, in: path, required: true, schema: { type: string, example: ord_k3x9f2ab7mqp3x9f } }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }
        "401": { description: Invalid credentials }
        "404": { description: Unknown order, or it belongs to another merchant or mode }
        "429": { description: Per-merchant rate limit exceeded }
  /api/pay/{orderId}:
    get:
      tags: [Customer Checkout]
      summary: Checkout page data
      description: |
        What the customer's checkout page shows. No login: the order id in the address is the only key.
        Payment details (UPI id, UPI link and QR code) are included only while the order is `pending`.
        The bank account number and IFSC are never returned. Rate limited per IP and order.
      security: []
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, example: ord_k3x9f2ab7mqp3x9f } }
      responses:
        "200":
          description: The order as the customer sees it
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  order: { $ref: "#/components/schemas/CheckoutOrder" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/pay/{orderId}/claim:
    post:
      tags: [Customer Checkout]
      summary: Claim a payment with its UTR
      description: |
        The customer enters the 12-digit UTR from their payment app. The order is paid only if an unclaimed
        statement line exists with that UTR, for the same amount, on the bank this order asked them to pay.
        A line can be claimed once, however many orders try. "Not found" never reveals whether the UTR exists
        for something else. Limited to 10 tries per order and IP per 10 minutes.
      security: []
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, example: ord_k3x9f2ab7mqp3x9f } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utr]
              properties:
                utr: { type: string, pattern: "^\\d{12}$", example: "412345678901" }
      responses:
        "200":
          description: Paid; the order is now `success`
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  order: { $ref: "#/components/schemas/CheckoutOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: "`PAYMENT_NOT_FOUND` (no matching unclaimed payment; the customer may retry) or `ORDER_NOT_FOUND`"
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "409":
          description: "`ORDER_NOT_PENDING`: the order is already paid or has expired"
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429":
          description: "`TOO_MANY_ATTEMPTS`"
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
  /health:
    get:
      tags: [Ops]
      summary: Liveness check
      security: []
      responses:
        "200": { description: Healthy }
  /health/ready:
    get:
      tags: [Ops]
      summary: Readiness check (MongoDB and Redis)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: A dependency is down }
  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics
      description: "If METRICS_TOKEN is set, send an Authorization header of the form: Bearer <token>."
      security: []
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain: { schema: { type: string } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    merchantSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        Send `X-MID`, `X-Timestamp` (unix seconds, within 5 minutes) and `X-Signature` =
        hex `HMAC_SHA256(secret, timestamp + "\n" + METHOD + "\n" + pathWithQuery + "\n" + sha256hex(rawBody))`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, example: ord_k3x9f2ab7mqp3x9f }
  schemas:
    PayinCallback:
      type: object
      properties:
        event: { type: string, enum: [order.success, order.failed] }
        status: { type: string, enum: [pending, delivered, failed, cancelled] }
        statusCode: { type: integer, nullable: true }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    PayinOrder:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string, example: ord_k3x9f2ab7mqp3x9f }
        merchantOrderId: { type: string, nullable: true }
        merchant:
          type: object
          properties:
            id: { type: string }
            mid: { type: string }
            businessName: { type: string }
        mode: { type: string, enum: [sandbox, production] }
        status: { type: string, enum: [pending, success, failed] }
        statusReason: { type: string, nullable: true }
        amountPaise: { type: integer }
        feePaise: { type: integer, nullable: true, description: Null until the order succeeds, and for orders without a stored rate }
        payablePaise: { type: integer, nullable: true }
        utr: { type: string, nullable: true }
        bank:
          type: object
          properties:
            bankId: { type: string }
            bankName: { type: string }
            holderName: { type: string }
            accountNumber: { type: string }
            ifsc: { type: string }
            upiId: { type: string }
        callback: { $ref: "#/components/schemas/PayinCallback" }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WebhookEvent:
      type: string
      enum: [checkout.created, payment.success]
    Transaction:
      type: object
      properties:
        _id: { type: string }
        id: { type: string, example: "TXN-0f8b2c1e-..." }
        amount: { type: number }
        status: { type: string, enum: [Success, Pending, Failed] }
        date: { type: string, format: date-time }
        utr: { type: string, nullable: true }
        userId: { type: string, nullable: true }
    LoginResponse:
      type: object
      properties:
        success: { type: boolean }
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            role: { type: string, enum: [admin, agent, merchant] }
            username: { type: string, nullable: true }
        mustChangePassword: { type: boolean, description: True after login with a temporary password }
        mfaSetupRequired: { type: boolean, description: "True when an admin requires two-factor and it is not set up yet; only `/api/2fa` calls work until it is" }
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string, nullable: true }
        email: { type: string }
        role: { type: string, enum: [admin, agent, merchant] }
        disabled: { type: boolean }
        mfaEnabled: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
    BankInput:
      type: object
      properties:
        holderName: { type: string }
        bankName: { type: string }
        accountNumber: { type: string, pattern: "^\\d{9,18}$" }
        ifsc: { type: string, example: YESB0000001 }
        upiId: { type: string, example: name@bank }
        minPaise: { type: integer, nullable: true }
        maxPaise: { type: integer, nullable: true }
        dailyLimitPaise: { type: integer, nullable: true }
        methods: { type: array, items: { type: string, enum: [UPI, IMPS] } }
        qrEnabled: { type: boolean }
        level: { type: string }
        status: { type: string, enum: [active, inactive] }
    TwoFactorRequired:
      type: object
      properties:
        success: { type: boolean }
        twoFactorRequired: { type: boolean }
        pendingToken: { type: string }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        code: { type: string, description: "Stable machine-readable code on some errors, for example `NO_BANK_AVAILABLE`. Branch on this, not on `message`.", example: NO_BANK_AVAILABLE }
        message: { type: string }
    CreateOrderInput:
      type: object
      required: [amountPaise]
      properties:
        amountPaise: { type: integer, minimum: 1, maximum: 100000000, example: 50000, description: "Whole paise: 50000 is Rs 500.00. Must be a number, not text." }
        merchantOrderId: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_\\-.:]{1,64}$", example: INV-1001, description: Your own reference; also makes the call safe to retry }
        description: { type: string, maxLength: 200 }
        customerName: { type: string, maxLength: 120 }
    Order:
      type: object
      properties:
        orderId: { type: string, example: ord_k3x9f2ab7mqp3x9f }
        merchantOrderId: { type: string, nullable: true }
        mode: { type: string, enum: [sandbox, production] }
        amountPaise: { type: integer }
        currency: { type: string, example: INR }
        description: { type: string }
        customerName: { type: string }
        status: { type: string, enum: [pending, success, failed] }
        statusReason: { type: string, nullable: true, example: expired }
        utr: { type: string, nullable: true, description: Set once the order is paid }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        checkoutUrl: { type: string, format: uri, description: Send the customer here to pay }
    OrderResponse:
      type: object
      properties:
        success: { type: boolean }
        order: { $ref: "#/components/schemas/Order" }
    CheckoutOrder:
      type: object
      description: The order as the customer's checkout page shows it
      properties:
        orderId: { type: string }
        status: { type: string, enum: [pending, success, failed] }
        statusReason: { type: string, nullable: true }
        mode: { type: string, enum: [sandbox, production], description: The page shows a Sandbox or Production badge }
        amountPaise: { type: integer }
        currency: { type: string }
        description: { type: string }
        merchantName: { type: string }
        expiresAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        payment:
          type: object
          nullable: true
          description: Only while the order is `pending`
          properties:
            holderName: { type: string }
            bankName: { type: string }
            upiId: { type: string }
            upiUri: { type: string, description: A `upi://pay` link that pre-fills payee and amount }
            qrDataUrl: { type: string, nullable: true, description: "PNG data URL of the QR code; null when the bank has QR switched off" }
    BankCredit:
      type: object
      properties:
        id: { type: string }
        bank:
          type: object
          properties:
            id: { type: string }
            bankId: { type: string, example: bank_k3x9f2ab }
            bankName: { type: string }
            holderName: { type: string }
        amountPaise: { type: integer }
        utr: { type: string }
        receivedAt: { type: string, format: date-time }
        note: { type: string }
        claimed: { type: boolean }
        claimedAt: { type: string, format: date-time, nullable: true }
        claimedMode: { type: string, enum: [sandbox, production], nullable: true }
        claimedByOrder: { type: string, nullable: true, description: The order id that claimed it }
        createdAt: { type: string, format: date-time }
    CallbackDelivery:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string, example: ord_k3x9f2ab7mqp3x9f }
        merchant:
          type: object
          description: Included in the admin log only
          properties:
            id: { type: string }
            mid: { type: string }
            businessName: { type: string }
        mode: { type: string, enum: [sandbox, production] }
        event: { type: string, enum: [order.success, order.failed] }
        url: { type: string }
        status: { type: string, enum: [pending, delivered, failed, cancelled], description: "`pending` is waiting for its next attempt; `failed` ran out of attempts" }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        statusCode: { type: integer, nullable: true, description: The receiver's last answer; null when it did not answer }
        error: { type: string, nullable: true }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        nextRetryAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CallbackPayload:
      type: object
      description: Body POSTed to your callback URL. Headers `X-Callback-Signature` and `X-Callback-Event` are included.
      properties:
        event: { type: string, enum: [order.success, order.failed] }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          properties:
            orderId: { type: string }
            merchantOrderId: { type: string, nullable: true }
            status: { type: string, enum: [success, failed] }
            statusReason: { type: string, nullable: true, example: expired }
            amountPaise: { type: integer }
            currency: { type: string, example: INR }
            utr: { type: string, nullable: true }
            paidAt: { type: string, format: date-time, nullable: true }
            mode: { type: string, enum: [sandbox, production] }
    WebhookPayload:
      type: object
      description: Body POSTed to your endpoint. Headers `X-Webhook-Signature` and `X-Webhook-Event` are included.
      properties:
        event: { $ref: "#/components/schemas/WebhookEvent" }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          properties:
            transactionId: { type: string }
            orderId: { type: string }
            amount: { type: number }
            utr: { type: string }
            status: { type: string }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    Forbidden:
      description: Not allowed for this role or resource
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    NotFound:
      description: Not found
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
