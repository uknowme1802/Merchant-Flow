services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: merchantflow-backend

    ports:
    - "5000:5000"

    env_file:
      .env

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/health/ready"
          # "node",
          # "healthcheck.js"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s